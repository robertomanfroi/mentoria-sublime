name: Keep Alive — Mentoria Sublime

on:
  schedule:
    - cron: '*/5 * * * *'  # a cada 5 minutos
  workflow_dispatch:        # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mentoria-sublime.onrender.com/login)
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Site online"
          else
            echo "⚠️ Site retornou status $STATUS"
            exit 1
          fi
